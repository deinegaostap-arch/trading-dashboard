<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trading Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #0f1116;
        }

        body {
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .dashboard {
            width: 100%;
            min-height: 100vh;

            display: grid;

            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(3, minmax(0, 1fr));

            gap: 6px;
            padding: 6px;

            background: #0f1116;
        }

        .chart {
            width: 100%;
            height: calc((100vh - 24px) / 3);

            min-width: 0;
            min-height: 0;

            background: #131722;
            border: 1px solid #252a35;
            border-radius: 4px;

            overflow: hidden;
        }

        .tradingview-widget-container {
            width: 100%;
            height: 100%;
        }

        .tradingview-widget-container__widget {
            width: 100%;
            height: 100%;
        }


        /* =========================================
           TABLET
           ========================================= */

        @media (max-width: 900px) {

            .dashboard {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: none;

                min-height: 100vh;
            }

            .chart {
                height: 50vh;
            }
        }


        /* =========================================
           PHONE
           ========================================= */

        @media (max-width: 600px) {

            html,
            body {
                width: 100%;
                min-height: 100%;
                overflow-x: hidden;
                overflow-y: auto;
            }

            .dashboard {
                width: 100%;

                display: grid;

                grid-template-columns: 1fr;
                grid-template-rows: none;

                gap: 4px;
                padding: 4px;

                min-height: 100vh;
            }

            .chart {
                width: 100%;
                height: 70vh;

                min-height: 420px;

                border-radius: 3px;
            }

            .tradingview-widget-container {
                width: 100%;
                height: 100%;
            }

            .tradingview-widget-container__widget {
                width: 100%;
                height: 100%;
            }
        }


        /* =========================================
           VERY SMALL PHONES
           ========================================= */

        @media (max-width: 380px) {

            .chart {
                height: 75vh;
                min-height: 400px;
            }
        }
    </style>
</head>
