<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trading Dashboard</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #000000;
    }

    body {
        overflow-x: hidden;
        font-family: Arial, sans-serif;
    }

    .dashboard {
        width: 100%;
        min-height: 100vh;

        display: grid;

        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));

        gap: 4px;
        padding: 4px;

        background: #000000;
    }

    .chart {
        width: 100%;
        height: calc((100vh - 20px) / 3);

        min-width: 0;
        min-height: 0;

        background: #000000;

        border: 1px solid #202020;
        border-radius: 2px;

        overflow: hidden;
    }

    .tradingview-widget-container,
    .tradingview-widget-container__widget {
        width: 100%;
        height: 100%;
    }

    /*
       TABLET / SMALL LAPTOP
    */
    @media (max-width: 900px) {
        .dashboard {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: none;
            min-height: 100vh;
        }

        .chart {
            height: 50vh;
        }
    }

    /*
       PHONE
    */
    @media (max-width: 600px) {

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            background: #000000;
        }

        .dashboard {
            width: 100%;

            display: grid;

            grid-template-columns: 1fr;
            grid-template-rows: none;

            gap: 3px;
            padding: 3px;

            min-height: 100vh;
        }

        .chart {
            width: 100%;

            /* примерно вдвое ниже прежнего варианта */
            height: 35vh;

            min-height: 240px;

            border-radius: 2px;
        }
    }

    /*
       VERY SMALL PHONES
    */
    @media (max-width: 380px) {
        .chart {
            height: 33vh;
            min-height: 220px;
        }
    }
</style>
</head>

<body>

    <div class="chart">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>

            <script
                type="text/javascript"
                src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
                async>
            {
                "autosize": true,
                "symbol": "OANDA:EURUSD",
                "interval": "240",
                "timezone": "Europe/Stockholm",
                "theme": "dark",
                "style": "1",
                "locale": "en",

                "allow_symbol_change": true,

                "hide_side_toolbar": false,
                "hide_top_toolbar": false,
                "hide_legend": false,
                "hide_volume": true,

                "withdateranges": false,
                "save_image": false,

                "compareSymbols": [],
                "watchlist": [],

                "enable_publishing": false,

                "backgroundColor": "#000000",
                "gridColor": "rgba(0,0,0,0)"
            }
            </script>
        </div>
